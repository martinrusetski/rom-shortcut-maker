name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    # macos-26 ships a recent Swift toolchain + Xcode 26 (actool) for the
    # optional app-icon compilation step.
    runs-on: macos-26
    permissions:
      contents: write

    env:
      PKG_DIR: RomShortcutMaker
      APP_NAME: Rom Shortcut Maker
      BINARY_NAME: RomShortcutMaker
      BUNDLE_ID: com.romshortcutmaker.app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test
        run: swift test
        working-directory: ${{ env.PKG_DIR }}

      - name: Build
        run: swift build -c release --arch arm64
        working-directory: ${{ env.PKG_DIR }}

      - name: Create app bundle
        run: |
          APP_BUNDLE="$APP_NAME.app"
          BIN_DIR="$(cd "$PKG_DIR" && swift build -c release --arch arm64 --show-bin-path)"
          BINARY="$BIN_DIR/$BINARY_NAME"
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          SPARKLE_PUB_KEY="$(tr -d '[:space:]' < sparkle_public_key.txt)"
          SPARKLE_FEED_URL="https://raw.githubusercontent.com/${{ github.repository }}/main/appcast.xml"

          rm -rf "$APP_BUNDLE"
          mkdir -p "$APP_BUNDLE/Contents/MacOS"
          mkdir -p "$APP_BUNDLE/Contents/Resources"
          cp "$BINARY" "$APP_BUNDLE/Contents/MacOS/$BINARY_NAME"

          # The app loads emulators.json via Bundle.module, which resolves the
          # SwiftPM resource bundle relative to Contents/Resources.
          APP_RESOURCE_BUNDLE="$BIN_DIR/RomShortcutMaker_RomShortcutMaker.bundle"
          if [ ! -d "$APP_RESOURCE_BUNDLE" ]; then
              echo "::error::App resource bundle not found at $APP_RESOURCE_BUNDLE"
              exit 1
          fi
          for RESOURCE_BUNDLE in "$BIN_DIR"/*.bundle; do
              [ -d "$RESOURCE_BUNDLE" ] || continue
              ditto "$RESOURCE_BUNDLE" "$APP_BUNDLE/Contents/Resources/$(basename "$RESOURCE_BUNDLE")"
          done

          # SwiftPM may emit either a macOS-style or flat resource bundle,
          # depending on the runner toolchain. Preserve the emitted layout and
          # require the resource to exist somewhere inside the named bundle.
          PACKAGED_RESOURCE_BUNDLE="$APP_BUNDLE/Contents/Resources/RomShortcutMaker_RomShortcutMaker.bundle"
          PACKAGED_EMULATORS="$(find "$PACKAGED_RESOURCE_BUNDLE" -type f -name emulators.json -print -quit)"
          if [ -z "$PACKAGED_EMULATORS" ]; then
              echo "::error::Packaged app is missing emulators.json"
              exit 1
          fi

          ASSETS="$PKG_DIR/RomShortcutMaker/Assets.xcassets"
          APP_ICON="$PKG_DIR/RomShortcutMaker/AppIcon.icon"
          if [ ! -d "$APP_ICON" ]; then
              echo "::error::Icon Composer document not found at $APP_ICON"
              exit 1
          fi

          echo "Compiling asset catalog and app icon..."
          xcrun actool "$ASSETS" "$APP_ICON" \
              --compile "$APP_BUNDLE/Contents/Resources" \
              --platform macosx \
              --minimum-deployment-target 26.0 \
              --app-icon AppIcon \
              --output-partial-info-plist /dev/null \
              --output-format human-readable-text
          ICON_PLIST_ENTRIES="    <key>CFBundleIconFile</key>
              <string>AppIcon</string>
              <key>CFBundleIconName</key>
              <string>AppIcon</string>"

          cat > "$APP_BUNDLE/Contents/Info.plist" << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>${BINARY_NAME}</string>
              <key>CFBundleIdentifier</key>
              <string>${BUNDLE_ID}</string>
              <key>CFBundleName</key>
              <string>${APP_NAME}</string>
              <key>CFBundleDisplayName</key>
              <string>${APP_NAME}</string>
              <key>CFBundleVersion</key>
              <string>${{ github.run_number }}</string>
              <key>CFBundleShortVersionString</key>
              <string>${VERSION}</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>LSMinimumSystemVersion</key>
              <string>26.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>NSPrincipalClass</key>
              <string>NSApplication</string>
              <key>SUFeedURL</key>
              <string>${SPARKLE_FEED_URL}</string>
              <key>SUPublicEDKey</key>
              <string>${SPARKLE_PUB_KEY}</string>
          ${ICON_PLIST_ENTRIES}
          </dict>
          </plist>
          PLIST

      - name: Embed Sparkle framework
        run: ./embed-sparkle.sh "$APP_NAME.app"

      - name: Ad-hoc code sign
        run: |
          codesign --sign - \
            --force \
            --options runtime \
            --entitlements RomShortcutMaker.entitlements \
            "$APP_NAME.app"
          codesign --verify --verbose "$APP_NAME.app"

      - name: Create DMG
        run: |
          VOL_NAME="$APP_NAME"
          DMG_FINAL="${BINARY_NAME}-${{ github.ref_name }}.dmg"
          STAGING="dmg_staging"

          rm -rf "${STAGING}"
          mkdir -p "${STAGING}"
          cp -R "$APP_NAME.app" "${STAGING}/"
          ln -s /Applications "${STAGING}/Applications"

          cat > "${STAGING}/README.txt" << 'TXTEOF'
          Rom Shortcut Maker — Installation

          1. Drag Rom Shortcut Maker.app onto the Applications folder.

          2. Since this app is not notarized, macOS will block it on first launch.
             To allow it, open Terminal and run:

               xattr -cr "/Applications/Rom Shortcut Maker.app"

             Then double-click the app to launch it.
             (Or use System Settings → Privacy & Security → Open Anyway.)

          3. Future updates install automatically from within the app —
             you won't need to re-download this installer or repeat step 2.
          TXTEOF

          hdiutil create -srcfolder "${STAGING}" -volname "${VOL_NAME}" \
            -fs HFS+ -fsargs "-c c=64,a=16,e=16" \
            -format UDZO -imagekey zlib-level=9 \
            -ov "${DMG_FINAL}"

          rm -rf "${STAGING}"

      - name: Sign update and update appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          DMG="${BINARY_NAME}-${TAG}.dmg"
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${DMG}"
          ./update-appcast.sh "$VERSION" "${{ github.run_number }}" "$DMG" "$DOWNLOAD_URL"

      - name: Update Homebrew cask
        run: |
          DMG="${BINARY_NAME}-${{ github.ref_name }}.dmg"
          SHA256=$(shasum -a 256 "$DMG" | cut -d ' ' -f 1)
          VERSION="${{ github.ref_name }}"
          VERSION_NO_V="${VERSION#v}"

          # The cask's url is interpolated from `version`, so only version and
          # sha256 need rewriting.
          sed -i '' \
            -e "s/version \".*\"/version \"$VERSION_NO_V\"/" \
            -e "s/sha256 \".*\"/sha256 \"$SHA256\"/" \
            Casks/rom-shortcut-maker.rb

      - name: Commit updated cask and appcast
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/rom-shortcut-maker.rb appcast.xml
          git commit -m "Update cask and appcast for ${{ github.ref_name }}" || true
          git push origin HEAD:main

      - name: Create GitHub Release
        run: |
          TAG="${{ github.ref_name }}"
          # actions/checkout leaves the tag ref peeled to its commit, which makes
          # git read the commit message instead of the annotated tag message.
          # Re-fetch the tag object so we get the real notes we wrote on the tag.
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          NOTES=$(git tag -l --format='%(contents:body)' "$TAG")
          if [ -z "$NOTES" ]; then
            NOTES="See [README](https://github.com/${{ github.repository }}/blob/main/README.md) for installation and usage instructions."
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "$NOTES" \
            "${BINARY_NAME}-${TAG}.dmg"
        env:
          GH_TOKEN: ${{ github.token }}
